name: secret-scan
on:
  pull_request:
  push:
    branches: [master]
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # pełna historia — scan sprawdza też przeszłość
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: scan sekretów + higiena repo
        run: python -m engine.orchestrator scan
      - name: kompilacja silnika
        run: python -m py_compile engine/*.py
  lint-tests:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: py_compile
        run: python -m py_compile engine/*.py
